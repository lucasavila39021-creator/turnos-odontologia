# Turnos Odontología — application.properties
# Variante A Java Spring Boot — congelada C-01

# Server
server.port=${PORT:8080}
server.forward-headers-strategy=native

# Timezone (RN-GL-02)
app.timezone=${APP_TIMEZONE:America/Argentina/Buenos_Aires}
app.turno-duracion-min=${APP_TURNO_DURACION_MIN:30}
app.horario-desde=${APP_HORARIO_DESDE:08:00}
app.horario-hasta=${APP_HORARIO_HASTA:18:00}
app.secret=${APP_SECRET:changeme-dev-secret-32-chars-min}

# Datasource — MySQL 8.0, env vars via .env
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:turnos_db}?serverTimezone=${APP_TIMEZONE:America/Argentina/Buenos_Aires}&useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&useUnicode=true
spring.datasource.username=${DB_USER:turnos_user}
spring.datasource.password=${DB_PASSWORD:changeme}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Actuator
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Problem Details (RFC 7807)
spring.mvc.problemdetails.enabled=true

# Session cookies — C-03 auth (RN-AU-01)
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${APP_COOKIE_SECURE:false}
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=30m
app.login-rate-limit.max-attempts=5
app.login-rate-limit.window-seconds=60

# Logging
logging.level.com.clinica.turnos=INFO
logging.level.org.flywaydb=INFO
