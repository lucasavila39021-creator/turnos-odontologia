<div th:fragment="contenido" xmlns:th="http://www.thymeleaf.org">
  <h1>Pacientes</h1>

  <form class="filtros" th:action="@{/pacientes}" method="get">
    <div class="campo">
      <label for="qDni">DNI</label>
      <input type="text" id="qDni" name="dni" th:value="${dni}"/>
    </div>
    <div class="campo">
      <label for="qApellido">Apellido</label>
      <input type="text" id="qApellido" name="apellido" th:value="${apellido}"/>
    </div>
    <div class="campo">
      <button type="submit">Buscar</button>
    </div>
  </form>

  <table class="resultados" th:if="${resultados} != null and !${resultados.isEmpty()}">
    <thead><tr><th>Apellido</th><th>Nombre</th><th>DNI</th><th>Ficha</th></tr></thead>
    <tbody>
      <tr th:each="p : ${resultados}">
        <td th:text="${p.apellido}">Pérez</td>
        <td th:text="${p.nombre}">Juan</td>
        <td th:text="${p.dni}">11111111</td>
        <td><a th:href="@{'/pacientes/' + ${p.id}}">Ver ficha</a></td>
      </tr>
    </tbody>
  </table>
  <p class="vacio" th:if="${resultados} == null or ${resultados.isEmpty()}">Sin resultados</p>

  <h2>Alta de paciente</h2>
  <div class="card" role="alert" th:if="${fieldErrors} != null and !${fieldErrors.isEmpty()}">
    <ul>
      <li class="error" th:each="e : ${fieldErrors}" th:text="${e.key} + ': ' + ${e.value}">error</li>
    </ul>
    <p th:if="${pacienteIdExistente} != null">
      <a th:href="@{'/pacientes/' + ${pacienteIdExistente}}">Ver ficha existente</a>
    </p>
  </div>
  <form th:action="@{/pacientes}" method="post">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
    <input type="hidden" name="qDni" th:value="${dni}"/>
    <input type="hidden" name="qApellido" th:value="${apellido}"/>
    <div class="campo">
      <label for="nuevoNombre">Nombre</label>
      <input type="text" id="nuevoNombre" name="nombre" th:value="${nuevoNombre}"/>
      <span class="error" th:if="${fieldErrors['nombre']}" th:text="${fieldErrors['nombre']}"></span>
    </div>
    <div class="campo">
      <label for="nuevoApellido">Apellido</label>
      <input type="text" id="nuevoApellido" name="apellido" th:value="${nuevoApellido}"/>
      <span class="error" th:if="${fieldErrors['apellido']}" th:text="${fieldErrors['apellido']}"></span>
    </div>
    <div class="campo">
      <label for="nuevoDni">DNI</label>
      <input type="text" id="nuevoDni" name="dni" th:value="${nuevoDni}"/>
      <span class="error" th:if="${fieldErrors['dni']}" th:text="${fieldErrors['dni']}"></span>
    </div>
    <div class="campo">
      <label for="nuevoTelefono">Teléfono (opcional)</label>
      <input type="text" id="nuevoTelefono" name="telefono" th:value="${nuevoTelefono}"/>
    </div>
    <div class="campo">
      <label for="nuevoEmail">Email (opcional)</label>
      <input type="email" id="nuevoEmail" name="email" th:value="${nuevoEmail}"/>
    </div>
    <button type="submit">Dar de alta y continuar al turno</button>
  </form>
</div>
