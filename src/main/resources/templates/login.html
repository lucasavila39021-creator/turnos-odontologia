<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Ingresar — Turnos Odontología</title>
  <link rel="stylesheet" th:href="@{/css/app.css}" href="/css/app.css"/>
</head>
<body>
<div class="container">
  <h1>Turnos Odontología</h1>
  <h2>Ingresar</h2>
  <div class="card" role="alert" th:if="${param.error}">
    <p class="error">Credenciales inválidas</p>
  </div>
  <div class="card" role="alert" th:if="${param.expired}">
    <p class="error">Sesión expirada</p>
    <p>Volvé a ingresar tus credenciales.</p>
  </div>
  <form th:action="@{/login}" method="post">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
    <div class="campo">
      <label for="username">Usuario</label>
      <input type="text" id="username" name="username" autocomplete="username" required="required"/>
    </div>
    <div class="campo">
      <label for="password">Contraseña</label>
      <input type="password" id="password" name="password" autocomplete="current-password" required="required"/>
    </div>
    <button type="submit">Ingresar</button>
  </form>
</div>
</body>
</html>
